# Builds every changed formula's bottle on each PR and keeps it as a workflow
# artifact only. publish-bottles.yml uploads it once, when the PR is ready to
# merge (docs/adr/0002-publish-bottles-like-homebrew-core.md).
#
# Based on the tests.yml that `brew tap-new` generates, with two changes:
# - Linux only: these formulas only install scripts, so their bottles are
#   identical on every platform, and two builds are enough for
#   `brew bottle --merge` to write an `all:` bottle.
# - --only-json-tab keeps the install receipt out of the tarball, which is
#   what makes the builds identical.
#
# No path filter: both jobs are required checks, and a required check on a
# path-filtered job stays pending forever on the PRs it skips.
name: Build bottles

on:
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    name: test-bot (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    container:
      image: ghcr.io/homebrew/brew:main # zizmor: ignore[unpinned-images] as generated by brew tap-new
      options: --privileged
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # 2026.11.14.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-formulae --only-json-tab --root-url=https://ghcr.io/v2/afrossard/tap

      - name: Upload bottles as artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
