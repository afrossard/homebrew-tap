name: Bottle formula

# Renovate already opens same-repo (non-fork) branches/PRs against Formula/*.rb
# to bump a formula's source url/sha256. This workflow reacts to that PR with a
# token that already has write access to its branch (no pull_request_target
# needed), builds a platform-independent bottle, publishes it as a GitHub
# Release asset in this repo, and commits the updated bottle block back onto
# the same branch - so one PR carries both the version bump and its bottle.
#
# push to main is the safety net for a PR merged before its bottle landed
# (e.g. merged right after Renovate force-pushed away the bottle commit): the
# same state check finds the stale bottle and commits the fix onto main.
#
# workflow_dispatch runs the same build unconditionally, for manual bottle
# rebuilds or to exercise the mechanism outside of a Renovate PR.
#
# The bottle commit is pushed with a GitHub App installation token, not
# GITHUB_TOKEN. GitHub holds runs for GITHUB_TOKEN pushes onto a PR branch for
# manual approval, and closes any still held at merge as zero-job failures. An
# App token's push triggers ordinary CI, including this workflow, which then
# finds nothing stale and builds nothing - the state check makes it loop-safe.
# Setup: an App with Contents read/write installed on this repo, its client ID
# in vars.BOTTLE_APP_CLIENT_ID, its slug in vars.BOTTLE_APP_SLUG, and its
# private key in secrets.BOTTLE_APP_PRIVATE_KEY.
on:
  pull_request:
    paths:
      - "Formula/**"
  push:
    branches:
      - main
    paths:
      - "Formula/**"
  workflow_dispatch:
    inputs:
      formula:
        description: Formula name to bottle (without .rb), e.g. agent-runtime
        required: true
        default: agent-runtime

permissions:
  contents: write

concurrency:
  group: bottle-${{ github.event.pull_request.number || github.ref }}
  # A run triggered by this workflow's own bottle push must queue behind the
  # run that pushed it rather than cancel it while it is still finishing.
  cancel-in-progress: ${{ github.actor != format('{0}[bot]', vars.BOTTLE_APP_SLUG) }}

jobs:
  bottle:
    runs-on: ubuntu-latest
    steps:
      - name: Mint a GitHub App token to push the bottle commit with
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOTTLE_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOTTLE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Determine branch to build and push onto
        id: branch
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "name=${{ github.event.pull_request.head.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.branch.outputs.name }}
          fetch-depth: 0

      - name: Install Homebrew
        id: homebrew
        # Homebrew is a rolling release with no stable-release concept, and
        # Renovate cannot reliably pin/bump this action's CalVer tags (see
        # PR history on this file) - float on main instead of chasing pins.
        uses: Homebrew/actions/setup-homebrew@main

      - name: Reset checkout to the real branch tip
        # setup-homebrew's own internal fetch/checkout (to trust this tap)
        # moves HEAD to $GITHUB_SHA, which for a pull_request event is a
        # synthetic merge-with-base commit, not the branch tip - committing
        # on top of that would splice a phantom merge commit into the PR
        # branch's real history. Force back to the actual branch tip first,
        # which is also the formula the step below must judge.
        run: |
          set -euo pipefail
          git fetch origin "${{ steps.branch.outputs.name }}"
          git checkout -B "${{ steps.branch.outputs.name }}" "origin/${{ steps.branch.outputs.name }}"

      - name: Determine which formulas need a bottle rebuild
        id: formulas
        env:
          TAP_NAME: ${{ steps.homebrew.outputs.tap-name }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            formulas="Formula/${{ inputs.formula }}.rb"
          else
            stale="$(.github/scripts/formulas-needing-bottle.sh)"
            formulas="$(tr '\n' ' ' <<<"$stale")"
          fi
          echo "list=${formulas}" >> "$GITHUB_OUTPUT"
          if [ -z "${formulas// /}" ]; then
            echo "Every formula already has a bottle for its current version - skipping bottle build."
          fi

      - name: Build and publish bottle(s)
        if: steps.formulas.outputs.list != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAP_NAME: ${{ steps.homebrew.outputs.tap-name }}
        run: |
          set -euo pipefail
          for f in ${{ steps.formulas.outputs.list }}; do
            .github/scripts/build-and-publish-bottle.sh "$f"
          done

      - name: Commit updated formula(s) back onto the branch
        if: steps.formulas.outputs.list != ''
        run: |
          set -euo pipefail
          bot="${{ steps.app-token.outputs.app-slug }}[bot]"
          bot_id="$(GH_TOKEN="${{ steps.app-token.outputs.token }}" gh api "/users/${bot}" --jq .id)"
          git config user.name "${bot}"
          git config user.email "${bot_id}+${bot}@users.noreply.github.com"
          # setup-homebrew's own fetch/checkout inside the tap (this same
          # checkout) drops the credential actions/checkout wired up, so
          # re-authenticate origin before pushing. Push as the App, not with
          # GITHUB_TOKEN, so the bottle commit gets CI without an approval hold.
          git remote set-url origin "https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/${{ github.repository }}.git"
          git add ${{ steps.formulas.outputs.list }}
          if git diff --cached --quiet; then
            echo "Bottle unchanged - nothing to commit."
          else
            git commit -m "chore: rebuild bottle for ${{ steps.formulas.outputs.list }}"
            git push origin "HEAD:${{ steps.branch.outputs.name }}"
          fi
