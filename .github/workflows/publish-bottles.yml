# Publishes a PR's bottles once, when the PR is ready to merge, following
# homebrew-core's publish-commit-bottles.yml
# (docs/adr/0002-publish-bottles-like-homebrew-core.md):
# 1. take the bottles the PR's Build bottles run kept as artifacts,
# 2. upload them to GHCR with `brew pr-upload`, which refuses a tag that
#    already exists, so a bottle main depends on is never replaced,
# 3. push the resulting bottle commit onto the PR branch as the GitHub App,
# 4. turn on squash auto-merge pinned to that commit.
#
# Build bottles calls this for Renovate's PRs. For any other PR, dispatch it
# with the PR number and the head commit you reviewed.
#
# The bottle commit is pushed with a GitHub App installation token, not
# GITHUB_TOKEN, so it gets ordinary CI instead of runs held for approval.
# Setup: an App with Contents read/write installed on this repo, its client ID
# in vars.BOTTLE_APP_CLIENT_ID and its private key in
# secrets.BOTTLE_APP_PRIVATE_KEY; "Allow auto-merge" on in the repo settings.
name: Publish bottles

on:
  workflow_call:
    inputs:
      pull_request:
        type: string
        required: true
      head_sha:
        type: string
        required: true
      build_run_id:
        type: string
        required: true
    secrets:
      BOTTLE_APP_PRIVATE_KEY:
        required: true
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number
        required: true
      head_sha:
        description: The pull request's reviewed head commit SHA
        required: true

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

env:
  PR: ${{ inputs.pull_request }}
  HEAD_SHA: ${{ inputs.head_sha }}

jobs:
  # Decides from the PR's current state, never from what a commit changed:
  # - publish: the build of this head produced bottles,
  # - merge: the head is already the App's bottle commit, or a dispatched PR
  #   changes no formula,
  # - none: an automatic run for a PR that changes no formula, so Renovate's
  #   other PRs are never merged from here.
  plan:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      action: ${{ steps.plan.outputs.action }}
      branch: ${{ steps.plan.outputs.branch }}
      build_run_id: ${{ steps.plan.outputs.build_run_id }}
    steps:
      - name: Mint a GitHub App token to learn the App's name
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.BOTTLE_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOTTLE_APP_PRIVATE_KEY }}
          permission-contents: read

      - name: Decide whether to publish, only merge, or do nothing
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          CALLER_BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          pr="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state,baseRefName,headRefName,headRefOid,isCrossRepository)"
          if [ "$(jq -r .state <<<"$pr")" != OPEN ] ||
             [ "$(jq -r .baseRefName <<<"$pr")" != main ] ||
             [ "$(jq -r .isCrossRepository <<<"$pr")" != false ]; then
            echo "::error::PR #$PR must be open, target main, and come from a branch of this repository."
            exit 1
          fi
          if [ "$(jq -r .headRefOid <<<"$pr")" != "$HEAD_SHA" ]; then
            echo "::error::PR #$PR moved past $HEAD_SHA, so it is not the commit that was built and reviewed."
            exit 1
          fi

          # A dispatch retries a publish that failed, so its build run counts
          # as soon as both test-bot jobs passed, whatever happened after.
          build_run_id="${CALLER_BUILD_RUN_ID:-$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build-bottles.yml/runs?head_sha=$HEAD_SHA&event=pull_request" --jq '.workflow_runs[0].id // empty')}"
          built="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/${build_run_id:-0}/jobs" --jq '[.jobs[] | select(.name | startswith("test-bot")) | .conclusion] | length > 0 and all(. == "success")' 2>/dev/null || echo false)"
          if [ "$built" != true ]; then
            echo "::error::No Build bottles run for $HEAD_SHA whose test-bot jobs all passed."
            exit 1
          fi
          bottles="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$build_run_id/artifacts" --jq '[.artifacts[] | select(.name | startswith("bottles_")) | select(.expired | not)] | length')"
          head_author="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA" --jq '.author.login // empty')"

          if [ "$head_author" = "${APP_SLUG}[bot]" ]; then
            action=merge
          elif [ "$bottles" -gt 0 ]; then
            action=publish
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            action=merge
          else
            action=none
          fi
          echo "::notice::PR #$PR at $HEAD_SHA: $action"
          {
            echo "action=$action"
            echo "branch=$(jq -r .headRefName <<<"$pr")"
            echo "build_run_id=$build_run_id"
          } >> "$GITHUB_OUTPUT"

  publish:
    needs: plan
    if: needs.plan.outputs.action == 'publish'
    runs-on: ubuntu-latest
    # A second publish of the same PR waits instead of racing this one.
    concurrency:
      group: publish-bottles-${{ inputs.pull_request }}
      cancel-in-progress: false
    permissions:
      actions: read # download the build run's bottle artifacts
      contents: read
      packages: write # brew pr-upload to GHCR
    outputs:
      bottle_commit: ${{ steps.pr-upload.outputs.bottle_commit }}
    steps:
      - name: Mint a GitHub App token to push the bottle commit with
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.BOTTLE_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOTTLE_APP_PRIVATE_KEY }}
          permission-contents: write

      # Taps this checkout in place; do not `brew tap` it again (AGENTS.md).
      # No `token` input: setup-homebrew would store it as a global git
      # extraheader, and the push below would then go out as GITHUB_TOKEN
      # instead of the App.
      - name: Set up Homebrew
        id: homebrew
        uses: Homebrew/actions/setup-homebrew@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # 2026.11.14.1

      - name: Check out the pull request's head commit
        working-directory: ${{ steps.homebrew.outputs.repository-path }}
        env:
          BRANCH: ${{ needs.plan.outputs.branch }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"

      - name: Download the pull request's bottles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bottles_*
          path: ${{ runner.temp }}/bottles
          merge-multiple: true
          run-id: ${{ needs.plan.outputs.build_run_id }}
          github-token: ${{ github.token }}

      - name: Commit as the GitHub App
        working-directory: ${{ steps.homebrew.outputs.repository-path }}
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          bot="${APP_SLUG}[bot]"
          email="$(GH_TOKEN="$APP_TOKEN" gh api "/users/${bot}" --jq .id)+${bot}@users.noreply.github.com"
          git config user.name "$bot"
          git config user.email "$email"
          {
            echo "HOMEBREW_GIT_NAME=$bot"
            echo "HOMEBREW_GIT_EMAIL=$email"
          } >> "$GITHUB_ENV"

      # Merges the per-platform builds into one `all:` bottle, writes the
      # bottle blocks with the root_url test-bot recorded, commits them, and
      # uploads to GHCR.
      - name: Upload the bottles to GHCR and commit the bottle blocks
        id: pr-upload
        working-directory: ${{ runner.temp }}/bottles
        env:
          HOMEBREW_GITHUB_PACKAGES_USER: ${{ github.repository_owner }}
          HOMEBREW_GITHUB_PACKAGES_TOKEN: ${{ github.token }}
          REPO_PATH: ${{ steps.homebrew.outputs.repository-path }}
        run: |
          brew pr-upload
          echo "bottle_commit=$(git -C "$REPO_PATH" rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push the bottle commit onto the pull request branch
        working-directory: ${{ steps.homebrew.outputs.repository-path }}
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ needs.plan.outputs.branch }}
        run: |
          # A plain push, never forced: it fails if the branch moved meanwhile.
          git push "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"

  merge:
    needs: [plan, publish]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.plan.outputs.action != 'none' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh pr merge
      pull-requests: write # gh pr merge --auto
    env:
      GH_TOKEN: ${{ github.token }}
      MERGE_SHA: ${{ needs.publish.outputs.bottle_commit || inputs.head_sha }}
    steps:
      # As in homebrew-core: auto-merge is refused until a fresh push has
      # registered as the PR's head.
      - name: Wait until GitHub reports the commit to merge as the PR's head
        run: |
          for delay in 1 2 4 8 16 32 64; do
            if [ "$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)" = "$MERGE_SHA" ]; then
              exit 0
            fi
            sleep "$delay"
          done
          echo "::error::PR #$PR's head never became $MERGE_SHA."
          exit 1

      - name: Squash-merge once checks pass on that commit
        run: gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --squash --match-head-commit "$MERGE_SHA"
